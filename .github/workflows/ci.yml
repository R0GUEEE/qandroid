name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  unit:
    name: unit tests + syntax
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: host toolchain
        run: |
          # hosted images carry third-party repos that intermittently 403
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list || true
          sudo apt-get -o Acquire::Retries=5 update -qq
          # e2fsprogs: the rootfs-build test creates a real ext4 image
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config e2fsprogs

      - name: composer module syntax check (vendored shim headers)
        run: make hwc-check

      - name: unit tests
        run: |
          for t in tests/test_tools.py tests/test_cli.py tests/test_hwc_proto.py \
                   tests/test_rootfs_build.py tests/test_packaging.py; do
            echo "::group::$t"
            python3 "$t" -v
            echo "::endgroup::"
          done

      - name: static checks
        run: sh scripts/lint.sh

  build:
    name: cross-build (arm64 guest + host client)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list || true
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            libsdl2-dev pkg-config file e2fsprogs

      - name: host helper (binderfs node creator)
        run: make tools && file tools/binder-mk

      - name: guest composer module (aarch64)
        run: |
          make -C hwc AARCH64_CC=aarch64-linux-gnu-gcc
          file hwc/hwcomposer.qandroid.so
          file hwc/hwcomposer.qandroid.so | grep -q 'ARM aarch64' \
            || { echo "::error::composer module is not aarch64"; exit 1; }

      - name: guest bionic shim (aarch64)
        run: make shim AARCH64_CC=aarch64-linux-gnu-gcc && file shim/libabshim.so

      - name: host display client (x86_64, SDL2)
        run: |
          make client
          file frontend/hwc_client
          ./frontend/hwc_client --help 2>&1 | head -2 || true

      - name: CLI smoke
        run: |
          ./qandroid --help >/dev/null
          ./qandroid doctor || true
          ./qandroid image list --abi arm64 --limit 2 || true

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qandroid-build-${{ github.sha }}
          if-no-files-found: error
          path: |
            hwc/hwcomposer.qandroid.so
            shim/libabshim.so
            tools/binder-mk
            frontend/hwc_client

  deb:
    name: debian package (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list || true
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libsdl2-dev dpkg-dev lintian

      - name: build the package
        run: |
          rm -rf dist
          ./packaging/build-deb.sh --out dist
          test "$(ls dist/*.deb | wc -l)" -eq 1 || { echo "::error::expected one .deb"; exit 1; }

      - name: inspect
        run: |
          deb=$(ls dist/qandroid_*_amd64.deb)
          echo "artifact: $deb"
          dpkg-deb --info "$deb"
          # one listing to a file: piping dpkg-deb into `grep -q` makes it die of
          # SIGPIPE the moment grep finds a match
          dpkg-deb --contents "$deb" > /tmp/deb-contents.txt
          wc -l < /tmp/deb-contents.txt
          for f in usr/bin/qandroid usr/lib/qandroid/qandroid \
                   usr/lib/qandroid/tools/binder-mk \
                   usr/lib/qandroid/frontend/hwc_client \
                   usr/share/man/man1/qandroid.1.gz; do
            grep -q "$f" /tmp/deb-contents.txt \
              || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum "$deb" | tee SHA256SUMS.deb

      - name: lintian
        continue-on-error: true
        run: lintian --no-tag-display-limit --fail-on error dist/*.deb || true

      - name: install it for real
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/qandroid_*.deb
          qandroid --version
          command -v qandroid
          ls -l /usr/lib/qandroid | head -5
          qandroid doctor || true

      - name: run from the installed package
        run: |
          # an installed qandroid must find its own tree, its tools and its docs
          qandroid --help | head -3
          test -x /usr/lib/qandroid/tools/binder-mk
          # docs live under /usr/share/doc, not in the payload tree
          test -f /usr/share/doc/qandroid/docs/BRINGUP.md
          test -f /usr/share/doc/qandroid/README.md
          man --warnings -l /usr/share/man/man1/qandroid.1.gz > /dev/null
          echo "man page renders"

      - name: remove it cleanly
        run: |
          sudo dpkg -r qandroid
          test ! -e /usr/lib/qandroid && echo "removed cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: qandroid-deb
          path: |
            dist/*.deb
            SHA256SUMS.deb
          if-no-files-found: error

  installer:
    name: install.sh (real hosts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning install.sh

      - name: build a package to install
        run: |
          sudo apt-get install -y --no-install-recommends build-essential pkg-config
          ./packaging/build-deb.sh --out dist
          ls -l dist/

      - name: help and dry run
        run: |
          sh install.sh --help | head -4
          sh install.sh --dry-run --version 0.3.0 | tail -8
          sh install.sh --source --dry-run --version 0.3.0 | tail -3
          sh install.sh --file /nonexistent.deb 2>&1 | tail -1 || true

      - name: install the .deb inside a clean ubuntu container
        run: |
          docker run --rm -v "$PWD:/src" ubuntu:24.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates curl >/dev/null
            sh /src/install.sh --file "$(ls /src/dist/*.deb)"
            qandroid --version
            qandroid doctor || true
            test -x /usr/lib/qandroid/tools/binder-mk
            sh /src/install.sh --uninstall
            # bash caches command paths: without dropping the cache, `command -v`
            # keeps reporting the deleted /usr/bin/qandroid
            hash -r
            test ! -e /usr/bin/qandroid || { echo "left behind: /usr/bin/qandroid"; exit 1; }
            command -v qandroid && { echo "still on PATH"; exit 1; } || echo "uninstalled, CLI gone"
          '

      - name: source install inside a clean alpine container
        run: |
          docker run --rm -v "$PWD:/src" alpine:3.20 sh -euc '
            # build-base so the installer can compile the host helpers, which is
            # what a real user with a compiler gets
            apk add --no-cache curl tar build-base
            sh /src/install.sh --source --version 0.3.0 --prefix /opt/qandroid
            qandroid --version
            test -f /opt/qandroid/qandroid
            test -x /opt/qandroid/tools/binder-mk
          '

  package:
    name: source tarball
    needs: [unit, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in ""|main|master) VERSION=0.2 ;; esac
          OUT="$RUNNER_TEMP/qandroid-$VERSION.tar.gz"
          # never write the archive inside the tree being archived: tar would
          # see it appear and fail with "file changed as we read it"
          tar --exclude=.git --exclude=__pycache__ \
              --transform "s,^\./,qandroid-$VERSION/," \
              -czf "$OUT" .
          cp "$OUT" .
          tar -tzf "qandroid-$VERSION.tar.gz" | head -12
          sha256sum "qandroid-$VERSION.tar.gz" | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qandroid-source
          path: |
            qandroid-*.tar.gz
            SHA256SUMS
