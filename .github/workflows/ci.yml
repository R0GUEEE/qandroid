name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  unit:
    name: unit tests + syntax
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: host toolchain
        run: |
          sudo apt-get update -qq
          # e2fsprogs: the rootfs-build test creates a real ext4 image
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config e2fsprogs

      - name: composer module syntax check (vendored shim headers)
        run: make hwc-check

      - name: unit tests
        run: |
          for t in tests/test_tools.py tests/test_cli.py tests/test_hwc_proto.py \
                   tests/test_rootfs_build.py tests/test_packaging.py; do
            echo "::group::$t"
            python3 "$t" -v
            echo "::endgroup::"
          done

      - name: static checks
        run: sh scripts/lint.sh

  build:
    name: cross-build (arm64 guest + host client)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            libsdl2-dev pkg-config file e2fsprogs

      - name: host helper (binderfs node creator)
        run: make tools && file tools/binder-mk

      - name: guest composer module (aarch64)
        run: |
          make -C hwc AARCH64_CC=aarch64-linux-gnu-gcc
          file hwc/hwcomposer.qandroid.so
          file hwc/hwcomposer.qandroid.so | grep -q 'ARM aarch64' \
            || { echo "::error::composer module is not aarch64"; exit 1; }

      - name: guest bionic shim (aarch64)
        run: make shim AARCH64_CC=aarch64-linux-gnu-gcc && file shim/libabshim.so

      - name: host display client (x86_64, SDL2)
        run: |
          make client
          file frontend/hwc_client
          ./frontend/hwc_client --help 2>&1 | head -2 || true

      - name: CLI smoke
        run: |
          ./qandroid --help >/dev/null
          ./qandroid doctor || true
          ./qandroid image list --abi arm64 --limit 2 || true

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qandroid-build-${{ github.sha }}
          if-no-files-found: error
          path: |
            hwc/hwcomposer.qandroid.so
            shim/libabshim.so
            tools/binder-mk
            frontend/hwc_client

  deb:
    name: debian package (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libsdl2-dev dpkg-dev lintian

      - name: build the package
        run: ./packaging/build-deb.sh --out dist

      - name: inspect
        run: |
          deb=$(ls dist/*.deb)
          echo "artifact: $deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | wc -l
          for f in usr/bin/qandroid usr/lib/qandroid/qandroid \
                   usr/lib/qandroid/tools/binder-mk \
                   usr/lib/qandroid/frontend/hwc_client \
                   usr/share/man/man1/qandroid.1.gz; do
            dpkg-deb --contents "$deb" | grep -q "$f" \
              || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum "$deb" | tee SHA256SUMS.deb

      - name: lintian
        continue-on-error: true
        run: lintian --no-tag-display-limit --fail-on error dist/*.deb || true

      - name: install it for real
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/qandroid_*.deb
          qandroid --version
          command -v qandroid
          ls -l /usr/lib/qandroid | head -5
          qandroid doctor || true

      - name: run from the installed package
        run: |
          # an installed qandroid must find its own tree, its tools and its docs
          qandroid --help | head -3
          test -x /usr/lib/qandroid/tools/binder-mk
          test -f /usr/lib/qandroid/docs/BRINGUP.md
          man --warnings -l /usr/share/man/man1/qandroid.1.gz > /dev/null
          echo "man page renders"

      - name: remove it cleanly
        run: |
          sudo dpkg -r qandroid
          test ! -e /usr/lib/qandroid && echo "removed cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: qandroid-deb
          path: |
            dist/*.deb
            SHA256SUMS.deb
          if-no-files-found: error

  package:
    name: source tarball
    needs: [unit, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in ""|main|master) VERSION=0.2 ;; esac
          OUT="$RUNNER_TEMP/qandroid-$VERSION.tar.gz"
          # never write the archive inside the tree being archived: tar would
          # see it appear and fail with "file changed as we read it"
          tar --exclude=.git --exclude=__pycache__ \
              --transform "s,^\./,qandroid-$VERSION/," \
              -czf "$OUT" .
          cp "$OUT" .
          tar -tzf "qandroid-$VERSION.tar.gz" | head -12
          sha256sum "qandroid-$VERSION.tar.gz" | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qandroid-source
          path: |
            qandroid-*.tar.gz
            SHA256SUMS
