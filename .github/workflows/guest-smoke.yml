name: guest-smoke

# Manual only: downloads an ~870 MiB arm64 Android image, builds a rootfs and
# tries to bring the guest up under QEMU on the runner.  This is a diagnostic
# harness, not a gate - a TCG-translated Android may take many minutes to reach
# zygote, and runner kernels vary in binderfs support.  Every step is captured
# and uploaded so a failure is readable instead of mysterious.

on:
  workflow_dispatch:
    inputs:
      image_variant:
        description: "Waydroid image variant"
        type: choice
        options: [VANILLA, GAPPS]
        default: VANILLA
      boot_mode:
        description: "guest boot mode"
        type: choice
        options: [manual, init]
        default: manual
      boot_timeout_seconds:
        description: "how long to let the guest run before dumping logs"
        default: "180"
      strace:
        description: "QEMU_STRACE value (empty = off, 1 = all guest syscalls)"
        default: ""
      qemu:
        description: "which qemu-aarch64 to run the guest with"
        type: choice
        options: [distro, source]
        default: distro
      qemu_tag:
        description: "qemu tag to build when qemu=source"
        default: v9.2.0

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: cache the system image
        uses: actions/cache@v4
        with:
          path: ~/.local/share/qandroid/images
          key: qandroid-image-${{ inputs.image_variant }}-arm64-v1

      - name: host prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support e2fsprogs \
            python3 curl unzip build-essential psmisc
          # binderfs: a module on Ubuntu generic kernels
          # binderfs is a module on Ubuntu kernels and hosted runners often lack
          # linux-modules-extra, which is where it lives
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          sudo modprobe binder_linux 2>/dev/null || sudo modprobe binder 2>/dev/null \
            || echo "::warning::binder module unavailable on this runner - IPC will fail"
          ls /sys/module/binder_linux 2>/dev/null || true
          sudo update-binfmts --enable qemu-aarch64 || true
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null || echo "::warning::binfmt not registered"

      - name: restore patched qemu
        id: qcache
        if: inputs.qemu == 'source'
        uses: actions/cache@v4
        with:
          path: /opt/qandroid-qemu
          key: qemu-${{ inputs.qemu_tag }}-${{ hashFiles('patches/apply.sh') }}

      - name: build qemu from source with patches applied
        if: inputs.qemu == 'source' && steps.qcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            ninja-build libglib2.0-dev libpixman-1-dev python3-venv
          git clone -q --depth 1 -b "${{ inputs.qemu_tag }}" \
            https://gitlab.com/qemu-project/qemu.git /tmp/qemu
          ./patches/apply.sh /tmp/qemu
          cd /tmp/qemu
          # static first (self-contained interpreter), dynamic as a fallback
          if ./configure --target-list=aarch64-linux-user --disable-system \
                 --disable-tools --disable-docs --static > /tmp/configure.log 2>&1 \
             && make -j"$(nproc)" >> /tmp/build.log 2>&1; then
            echo "built static"
          else
            echo "static build failed, retrying dynamically linked"
            tail -20 /tmp/configure.log /tmp/build.log || true
            make distclean || true
            ./configure --target-list=aarch64-linux-user --disable-system \
              --disable-tools --disable-docs
            make -j"$(nproc)"
          fi
          sudo mkdir -p /opt/qandroid-qemu
          sudo install -m0755 build/qemu-aarch64 /opt/qandroid-qemu/qemu-aarch64-static
          /opt/qandroid-qemu/qemu-aarch64-static --version
          file /opt/qandroid-qemu/qemu-aarch64-static

      - name: install patched qemu and register it for arm64 ELFs
        if: inputs.qemu == 'source'
        run: |
          sudo install -m0755 /opt/qandroid-qemu/qemu-aarch64-static \
            /usr/local/bin/qemu-aarch64-static
          /usr/local/bin/qemu-aarch64-static --version | head -1

          # Drop whatever entry the distro package registered: with the F
          # (fix-binary) flag the kernel pins the interpreter it opened at
          # registration time, so swapping the file underneath changes nothing.
          for n in qemu-aarch64 qandroid-aarch64; do
            if [ -e "/proc/sys/fs/binfmt_misc/$n" ]; then
              echo -1 | sudo tee "/proc/sys/fs/binfmt_misc/$n" >/dev/null 2>&1 || true
            fi
          done

          # Our own entry, no F flag: the interpreter is opened per exec, so the
          # patched binary is always the one that runs.
          line=':qandroid-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/local/bin/qemu-aarch64-static:POC'
          printf '%s' "$line" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          echo "--- registered entries ---"
          ls -1 /proc/sys/fs/binfmt_misc/
          cat /proc/sys/fs/binfmt_misc/qandroid-aarch64
          echo "magic bytes: $(awk '/^magic/{print $2}' /proc/sys/fs/binfmt_misc/qandroid-aarch64)"
          echo "interpreter: $(awk '/^interpreter/{print $2}' /proc/sys/fs/binfmt_misc/qandroid-aarch64)"

      - name: build host helpers
        run: |
          make tools
          ls -l tools/binder-mk tools/binder-ver

      - name: doctor
        run: ./qandroid doctor || true

      - name: fetch arm64 image
        run: ./qandroid image fetch --abi arm64 --variant "${{ inputs.image_variant }}"

      - name: build rootfs
        run: ./qandroid rootfs build

      - name: boot guest (headless, time-boxed)
        continue-on-error: true   # the experimental part: logs matter, colour does not
        run: |
          set +e
          sudo env QANDROID_STRACE="${{ inputs.strace }}" \
            timeout --signal=TERM "${{ inputs.boot_timeout_seconds }}" \
            sh scripts/30-boot.sh "$HOME/.local/share/qandroid/rootfs" "${{ inputs.boot_mode }}" \
            > /tmp/boot.out 2>&1
          echo "boot exit: $?" | tee -a /tmp/boot.out

      - name: can the host itself talk to binder?
        if: always()
        run: |
          ROOTFS="$HOME/.local/share/qandroid/rootfs"
          # the nodes only exist once boot has prepared /dev
          ./tools/binder-ver "$ROOTFS/dev/binderfs/binder" || true
          ./tools/binder-ver "$ROOTFS/dev/binder" || true

      - name: collect logs
        if: always()
        run: |
          ROOTFS="$HOME/.local/share/qandroid/rootfs"
          mkdir -p artifacts
          cp /tmp/boot.out artifacts/ 2>/dev/null || true
          for f in data/local/tmp/qandroid-boot.log data/local/tmp/*.pid; do
            [ -e "$ROOTFS/$f" ] && cp "$ROOTFS/$f" artifacts/ || true
          done
          sudo sh -c 'dmesg | tail -200' > artifacts/dmesg.txt 2>/dev/null || true
          # what actually made it into the guest userspace
          ls -l "$ROOTFS/system/bin" 2>/dev/null | head -40 > artifacts/system-bin.txt || true
          cat artifacts/qandroid-boot.log 2>/dev/null | tail -100 || true
          echo "### guest boot log (tail)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 artifacts/qandroid-boot.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: verdict
        if: always()
        run: |
          ROOTFS="$HOME/.local/share/qandroid/rootfs"
          LOG="$ROOTFS/data/local/tmp/qandroid-boot.log"
          {
            echo "### bring-up verdict"
            echo
            echo "| check | result |"
            echo "|---|---|"
            printf "| rootfs built | %s |\n" "$([ -f "$ROOTFS/.qandroid-rootfs" ] && echo yes || echo NO)"
            printf "| linker64 resolves | %s |\n" "$([ -e "$ROOTFS/apex/com.android.runtime/bin/linker64" ] && echo yes || echo 'no - /apex not bound')"
            printf "| /apex entries bound | %s |\n" "$(ls -1 "$ROOTFS/apex" 2>/dev/null | wc -l)"
            printf "| /dev/binder present | %s |\n" "$([ -e "$ROOTFS/dev/binder" ] && echo yes || echo no)"
            printf "| boot log lines | %s |\n" "$(wc -l < "$LOG" 2>/dev/null || echo 0)"
            pids=$(ls -1 "$ROOTFS"/data/local/tmp/*.pid 2>/dev/null | wc -l)
            alive=0
            for f in "$ROOTFS"/data/local/tmp/*.pid; do
              [ -f "$f" ] || continue
              kill -0 "$(cat "$f")" 2>/dev/null && alive=$((alive + 1))
            done
            printf "| service pid files | %s |\n" "$pids"
            printf "| services still alive | %s |\n" "$alive"
            printf "| qemu | %s |\n" "${{ inputs.qemu }} ${{ inputs.qemu_tag }}"
            echo
            echo '```'
            tail -40 "$LOG" 2>/dev/null || echo "(no guest log)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-smoke-logs
          path: artifacts/
          if-no-files-found: warn
